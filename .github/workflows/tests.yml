name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        framework:
          - php: '8.3'
            laravel: '^12.0'
            testbench: '^10.0'
          - php: '8.4'
            laravel: '^13.0'
            testbench: '^11.0'
        database: [sqlite, mysql, pgsql]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: tenancy-test
          MYSQL_DATABASE: tenancy_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptenancy-test"
          --health-interval=10s --health-timeout=5s --health-retries=10
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: tenancy-test
          POSTGRES_DB: tenancy_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      TENANCY_TEST_DB: ${{ matrix.database }}
      TENANCY_TEST_DATABASE: tenancy_test
      TENANCY_TEST_PASSWORD: tenancy-test
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.framework.php }}
          extensions: intl, mbstring, pdo_sqlite, pdo_mysql, pdo_pgsql
          coverage: none
      - run: composer require --dev 'laravel/framework:${{ matrix.framework.laravel }}' 'orchestra/testbench:${{ matrix.framework.testbench }}' --no-update
      - run: composer update --prefer-dist --no-interaction
      - run: composer test
      - run: vendor/bin/pint --test
      - uses: actions/setup-node@v4
        if: matrix.database == 'sqlite'
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        if: matrix.database == 'sqlite'
      - run: npx playwright install --with-deps chromium
        if: matrix.database == 'sqlite'
      - run: npm run test:browser
        if: matrix.database == 'sqlite'
